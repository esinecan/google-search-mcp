[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsearch-mcp"
version = "0.1.0"
description = "MCP tools over Google Search through a dedicated logged-in browser profile: personalized organic results, ads stripped, the full advanced-operator surface, and pagination"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "google", "search", "playwright", "agent", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "typer>=0.12",
    "mcp>=2.0.0",              # 2.0.0 removed mcp.server.fastmcp; server is on MCPServer now
    "playwright>=1.44",        # not optional here: the browser IS the transport
    "playwright-stealth>=1.0", # see session.py: every measured passing run had it applied
    "trafilatura>=2.0",        # boilerplate removal for with_content; see client.py
]

[project.urls]
Homepage = "https://github.com/esinecan/google-search-mcp"
Source = "https://github.com/esinecan/google-search-mcp"
Issues = "https://github.com/esinecan/google-search-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# The server script name matches the distribution name deliberately: that is what makes
# bare `uvx gsearch-mcp` work with no --from. `gsearch` is the CLI debugging surface and
# the one-time `gsearch login` bootstrap.
gsearch-mcp = "google_search_mcp.mcp_server:main"
gsearch = "google_search_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/google_search_mcp"]

# Explicit allowlist, not an exclude list. The repo root holds account credential files
# and `.session/` holds live Google cookies; both are gitignored, but a build backend
# works from the working tree and the downside here is publishing a password to PyPI.
# Allowlisting means a new secret dropped in the root is not shipped by default.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
